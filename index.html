<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEN'SMP | Official PvP Tiers & Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    
    <header>
        <div class="logo-container">
            <h1 class="glow-text">SEN'SMP</h1>
            <span class="subtitle">OFFICIAL PVP TIERLIST</span>
        </div>
    </header>

    <main class="container">
        <!-- Search Section -->
        <section class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Player IGN..." onkeyup="filterPlayers()">
                <button class="search-btn">🔍</button>
            </div>
        </section>

        <!-- Stats Overview Bar -->
        <section class="stats-bar">
            <div class="stat-card">
                <span class="stat-num" id="totalPlayers">0</span>
                <span class="stat-label">RANKED PLAYERS</span>
            </div>
            <div class="stat-card">
                <span class="stat-num">3</span>
                <span class="stat-label">GAMEMODES</span>
            </div>
            <div class="stat-card">
                <span class="stat-num">CROSSPLAY</span>
                <span class="stat-label">JAVA + BEDROCK</span>
            </div>
        </section>

        <!-- Tier Category Tabs -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="switchCategory('all')">ALL TIERS</button>
            <button class="tab-btn" onclick="switchCategory('crystal')">💎 CRYSTAL</button>
            <button class="tab-btn" onclick="switchCategory('sword')">⚔️ SWORD</button>
            <button class="tab-btn" onclick="switchCategory('pot')">🧪 NETH POT</button>
        </div>

        <!-- Players List Grid -->
        <div class="players-grid" id="playersGrid">
            <!-- Dynamic Player Cards Will Load Here -->
        </div>
    </main>

    <footer>
        <p>© 2026 SEN'SMP CLAN WARS — Pure Competition & Fair Play</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
